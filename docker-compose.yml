version: '3'

services:
  avito_bot:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: avito_bot
    volumes:
      - ./database:/src/database
    command: ["python", "avito_bot.py"]

  telegram_bot:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: telegram_bot
    volumes:
      - ./database:/src/database
    command: ["python", "telegram_bot.py"]

  telegram_client:
    build:
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: telegram_client
    volumes:
      - ./database:/src/database
      - ./telegram_client_sessions:/src/telegram_client_sessions
    command: ["python", "telegram_client.py"]
    
  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./database:/usr/src/app/database
