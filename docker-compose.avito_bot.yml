services:
  avito_bot:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile
    volumes:
      - ./${SQLITE_DIR}:/src/${SQLITE_DIR}
    command: ["python", "avito_bot.py"]

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./${SQLITE_DIR}:/${SQLITE_DIR}

