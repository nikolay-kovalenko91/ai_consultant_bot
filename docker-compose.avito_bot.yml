services:
  avito_bot:
    env_file:
      - .env
    build:
      dockerfile: Dockerfile
    volumes:
      - ./database.db:/src/database.db
    command: ["python", "avito_bot.py"]

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./database.db:/database.db

